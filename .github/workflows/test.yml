name: Test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mongodb:
    name: Test (Ruby ${{ matrix.entry.ruby }}, Mongoid ${{ matrix.entry.mongoid }}, MongoDB ${{ matrix.entry.mongodb }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_ADAPTER: mongoid
      DATABASE_URL: mongodb://localhost
      MONGOID_VERSION: ${{ matrix.entry.mongoid }}
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.1', mongoid: '6.4.8', mongodb: '4.4' }
          - { ruby: '3.1', mongoid: '7.3.5', mongodb: '5.0' }
          - { ruby: '3.2', mongoid: '8.1.13', mongodb: '6.0' }
          - { ruby: '3.4', mongoid: '9.0.13', mongodb: '7.0' }
          - { ruby: '4.0', mongoid: '9.1.2', mongodb: '8.3' }
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.entry.mongodb }}
      - name: Run Tests
        run: bundle exec rake spec
  postgresql:
    name: Test (Ruby ${{ matrix.entry.ruby }}, PostgreSQL ${{ matrix.entry.postgresql }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_ADAPTER: activerecord
      DATABASE_URL: postgres://test:password@localhost/slack_ruby_bot_server_events_test
    strategy:
      fail-fast: false
      matrix:
        entry:
          - { ruby: '3.1', postgresql: '11' }
          - { ruby: '3.2', postgresql: '14' }
          - { ruby: '3.3', postgresql: '16' }
          - { ruby: '3.4', postgresql: '17' }
          - { ruby: '4.0', postgresql: '18' }
    services:
      postgres:
        image: postgres:${{ matrix.entry.postgresql }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: password
          POSTGRES_DB: slack_ruby_bot_server_events_test
        ports:
          - 5432:5432
        # the postgres container does not provide a health check
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
      - name: Set Up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.entry.ruby }}
          bundler-cache: true
      - name: Run Tests
        run: bundle exec rake spec
