plugins:
- rubocop-md
- rubocop-prose
- rubocop-rake
- rubocop-rspec
- rubocop-spellcheck
- rubocop-yaml

inherit_from: ".rubocop_todo.yml"

AllCops:
  NewCops: enable
  SuggestExtensions: false
  inherit_mode:
    merge:
    - Include
  Include:
  - ".github/**/*.yml"
  - ".rubocop.yml"
  Exclude:
  - coverage/**/*
  - pkg/**/*
  - vendor/**/*

Metrics:
  Enabled: false

Layout/LineLength:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/ModuleFunction:
  EnforcedStyle: extend_self

YAML/Lint/InvalidSyntax:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

YAML/Lint/DuplicateKey:
  Include:
  - "**/*.yml"
  - "**/*.yaml"

Naming/FileName:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - "**/*.md"
  - ".github/workflows/*.yml"

Markdown/HeadingCapitalization:
  inherit_mode:
    merge:
    - Exclude
  Enabled: true
  Style: title_case
  Exclude:
  - CHANGELOG.md

Prose/MaxLength:
  inherit_mode:
    merge:
    - Exclude
  Max: false
  Exclude:
  - CHANGELOG.md

Spellcheck:
  DictionaryFiles:
    en:
    - gem:rubocop-spellcheck/data/en/en.dic
    - ".spellcheck.txt"

Spellcheck/Spelling:
  Exclude: []

Markdown/CompactLists:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - CHANGELOG.md

Markdown/FenceLanguage:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - CHANGELOG.md

# Release examples run a release in a fixture and verify the tag, the next development commit, and their files together.
RSpec/ExampleLength:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - spec/release/release_spec.rb

RSpec/MultipleExpectations:
  inherit_mode:
    merge:
    - Exclude
  Exclude:
  - spec/release/release_spec.rb
